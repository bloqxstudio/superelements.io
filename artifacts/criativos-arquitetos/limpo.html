<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Avence · Criativo limpo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;background:#fff;font-family:"Inter Tight",Arial,sans-serif;color:#111;text-align:center}
h1{position:absolute;left:0;right:0;top:78px;margin:0;font-weight:500;font-size:124px;line-height:.98;letter-spacing:-.07em}
.sub{position:absolute;left:0;right:0;top:372px;margin:0;font-size:38px;line-height:1.3;letter-spacing:-.02em;color:#8c8c8c}
.btn{position:absolute;left:50%;top:508px;transform:translateX(-50%);width:410px;height:104px;border:2px solid #111;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:36px;letter-spacing:-.03em;font-weight:400}
.panel{position:absolute;left:44px;right:44px;top:690px;height:760px;background:#0b0b0b;border-radius:30px;padding:18px 18px 0;box-shadow:0 0 0 1px rgba(0,0,0,.9)}
.panel .s{border-radius:22px 22px 0 0;overflow:hidden;height:100%}
.panel img{display:block;width:100%;height:auto}
</style></head><body>
<article class="post">
  <h1>Seu site pronto<br>em até 48 horas.</h1>
  <p class="sub">Um site à altura da sua empresa.<br>Design, clareza e foco em conversão.</p>
  <div class="btn">Clique em saiba mais</div>
  <div class="panel"><div class="s"><img src="capturas/d-abertura.png"></div></div>
</article>
</body></html>
