<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Palco limpo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;overflow:hidden}
#p{position:relative;overflow:hidden;font-family:"Inter Tight",Arial,sans-serif;text-align:center;background:var(--bg);color:var(--fg);isolation:isolate}
#p.branco{--bg:#fff;--fg:#111;--sub:#8c8c8c;--panel:#0b0b0b;--edge:rgba(0,0,0,.9);--line:#111}
#p.preto{--bg:#0b0b0b;--fg:#f3f1ec;--sub:#8f8c86;--panel:#161616;--edge:rgba(243,241,236,.16);--line:#f3f1ec}
.abs{position:absolute;left:0;right:0}
h1{position:absolute;left:0;right:0;margin:0;font-weight:500;line-height:.98;letter-spacing:-.07em}
h1 span{display:block}
.sub{position:absolute;left:0;right:0;margin:0;color:var(--sub);letter-spacing:-.02em;line-height:1.3}
.btn{position:absolute;left:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:999px;font-weight:400;letter-spacing:-.03em;color:var(--fg)}
.panel{position:absolute;left:44px;right:44px;background:var(--panel);border-radius:30px;padding:18px 18px 0;box-shadow:0 0 0 1px var(--edge)}
.panel .s{border-radius:22px 22px 0 0;overflow:hidden;background:#0c0c0b}
.panel img{display:block;width:100%;height:auto}
.ph{position:absolute;background:#161616;border:1px solid rgba(243,241,236,.22);padding:9px;box-shadow:0 50px 90px -30px rgba(0,0,0,.8)}
.ph img{display:block;width:100%;height:auto}
.rise{will-change:transform,opacity,filter}
</style></head><body>
<div id="p"><h1 id="h"><span class="rise">Seu site pronto</span><span class="rise">em até 48 horas.</span></h1>
<p class="sub rise" id="sub">Um site à altura da sua empresa.<br>Design, clareza e foco em conversão.</p>
<div class="btn rise" id="btn">Clique em saiba mais</div>
<div class="panel rise" id="panel"><div class="s"><img id="shot"></div></div>
<div class="ph rise" id="ph" style="display:none"><div style="overflow:hidden"><img src="capturas/m-arquitetura.png"></div></div></div>
<script>
const $=(i)=>document.getElementById(i),clamp=(x)=>Math.max(0,Math.min(1,x)),oq=(x)=>1-Math.pow(1-x,4),ox=(x)=>x===1?1:1-Math.pow(2,-10*x)
const prog=(t,a,d,f=oq)=>f(clamp((t-a)/d))
function rise(el,p,dy=40,b=10){el.style.opacity=p;el.style.transform='translateY('+(1-p)*dy+'px)';el.style.filter=p<1?'blur('+(1-p)*b+'px)':'none'}
let story=false
window.configurar=({formato,tema})=>{
  story=formato==='story';const p=$('p');p.className=tema;p.style.width='1080px';p.style.height=(story?1920:1350)+'px'
  const L=story?{h:270,fs:132,sub:598,subfs:40,btn:780,bw:430,bh:108,bfs:38,panel:980}:{h:78,fs:124,sub:372,subfs:38,btn:508,bw:410,bh:104,bfs:36,panel:690}
  $('h').style.top=L.h+'px';$('h').style.fontSize=L.fs+'px'
  $('sub').style.top=L.sub+'px';$('sub').style.fontSize=L.subfs+'px'
  const b=$('btn');b.style.top=L.btn+'px';b.style.width=L.bw+'px';b.style.height=L.bh+'px';b.style.fontSize=L.bfs+'px';b.style.marginLeft=(-L.bw/2)+'px';b.style.left='50%'
  const pn=$('panel');pn.style.top=L.panel+'px';pn.style.height=(story?940:760)+'px'
  const ph=$('ph');ph.style.display=story?'block':'none'
  if(story){ph.style.left='640px';ph.style.top='1330px';ph.style.width='320px';ph.style.borderRadius='48px'}
  return true}
window.quadro=async(t,b64)=>{
  if(b64){const im=$('shot');im.src='data:image/jpeg;base64,'+b64;await im.decode().catch(()=>{})}
  const hs=$('h').children;rise(hs[0],prog(t,0.2,1.0,ox),60,14);rise(hs[1],prog(t,0.45,1.0,ox),60,14)
  rise($('sub'),prog(t,0.9,0.9),30,8)
  const bp=prog(t,1.2,0.8,ox);const b=$('btn');b.style.opacity=bp;b.style.transform='scale('+(0.94+0.06*bp)+')';b.style.filter=bp<1?'blur('+(1-bp)*6+'px)':'none'
  const pp=prog(t,0.6,1.5,ox);const pn=$('panel');pn.style.opacity=pp;pn.style.transform='perspective(2400px) translateY('+(1-pp)*(story?260:200)+'px) rotateX('+(1-pp)*8+'deg)';pn.style.filter=pp<1?'blur('+(1-pp)*8+'px)':'none'
  if(story){const q=prog(t,1.8,1.2,ox);const ph=$('ph');ph.style.opacity=q;ph.style.transform='rotate('+(3+1.5*Math.sin(t*.7))+'deg) translateY('+((1-q)*160+8*Math.sin(t*1.1)*q)+'px)'}
  await new Promise((r)=>requestAnimationFrame(()=>r()));return true}
</script></body></html>
