<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MSA · vídeo 4:5</title>
<style>
@font-face{font-family:Syne;src:url('/brands/marketing-sem-agencia/assets/fonts/syne-latin.woff2') format('woff2');font-weight:400 800;font-display:block}
@font-face{font-family:Urbanist;src:url('/brands/marketing-sem-agencia/assets/fonts/urbanist-latin.woff2') format('woff2');font-weight:300 600;font-display:block}
:root{
  --paper:#F3EFE4;--ink:#2F2317;--muted:#61695B;--sage:#BED499;--soft:#E6E1D2;
  --line-dark:rgba(243,239,228,.18);--on-dark:rgba(243,239,228,.74);--quiet:rgba(243,239,228,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--ink)}
body{font-family:Urbanist,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased}

/* ── margem de cima: marca e etiqueta ── */
.top{position:absolute;left:36px;right:36px;top:0;height:150px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:16px}
.brand b{font-family:Syne,sans-serif;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.04em;color:var(--paper)}
.brand span{font-weight:600;font-size:14px;letter-spacing:.2em;color:var(--on-dark)}
.tag{font-weight:600;font-size:15px;letter-spacing:.18em;color:var(--sage)}

/* ── a página de verdade, em 1120 px, reduzida a 90% ── */
.window{position:absolute;left:36px;top:150px;width:1008px;height:1050px;overflow:hidden;border-radius:2px;background:var(--ink);box-shadow:0 0 0 1px var(--line-dark)}
.window iframe{position:absolute;left:0;top:0;width:1120px;height:1167px;border:0;transform:scale(.9);transform-origin:0 0}

/* ── margem de baixo: as cinco partes da página ── */
.chapters{position:absolute;left:36px;right:36px;top:1248px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.chapter{position:relative;padding-top:16px}
.chapter::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--line-dark)}
.chapter i{position:absolute;left:0;top:0;height:2px;width:100%;background:var(--sage);transform-origin:0 50%;transform:scaleX(0)}
.chapter span{display:block;font-weight:600;font-size:14px;line-height:1;letter-spacing:.12em;text-transform:uppercase;color:var(--quiet);white-space:nowrap}
.chapter b{font-weight:600;margin-right:8px}
.chapter.on span{color:var(--paper)}

/* ── fecho ── */
.end{position:absolute;left:36px;right:36px;top:150px;bottom:0;padding:0 36px;visibility:hidden}
.end-eyebrow{position:absolute;left:36px;top:190px;font-weight:600;font-size:13px;letter-spacing:.2em;color:var(--sage)}
.end-title{position:absolute;left:36px;top:230px;font-family:Syne,sans-serif;font-weight:800;font-size:112px;line-height:.94;letter-spacing:-.035em;text-transform:uppercase;color:var(--paper)}
.spec{position:absolute;left:36px;right:36px;top:560px;border-bottom:1px solid var(--line-dark)}
.spec div{display:grid;grid-template-columns:230px 1fr;align-items:baseline;padding:24px 0;border-top:1px solid var(--line-dark)}
.spec small{font-weight:600;font-size:14px;letter-spacing:.18em;color:var(--on-dark)}
.spec strong{font-weight:500;font-size:28px;line-height:1.2;color:var(--paper)}
.end-cta{position:absolute;left:36px;top:900px;font-weight:500;font-size:32px;line-height:1.3;color:var(--on-dark)}
.end-cta em{position:relative;font-style:normal;font-weight:600;color:var(--paper);padding-bottom:6px}
.end-cta em::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--sage);transform-origin:0 50%;transform:scaleX(var(--u,0))}
</style>
</head>
<body>

<header class="top">
  <div class="brand rise"><b>MSA</b><span>MARKETING SEM AGÊNCIA</span></div>
  <div class="tag rise">CASE · WEB DESIGN</div>
</header>

<div class="window rise" id="window"><iframe id="site" title="Site MSA" src="/reel/msa-page.html"></iframe></div>

<div class="chapters" id="chapters"></div>

<section class="end" id="end">
  <div class="end-eyebrow end-rise">O PROJETO</div>
  <h2 class="end-title end-rise">Do<br>método<br>ao site.</h2>
  <div class="spec">
    <div class="end-rise"><small>ESCOPO</small><strong>Homepage em 9 seções</strong></div>
    <div class="end-rise"><small>CONSTRUÇÃO</small><strong>Elementor nativo</strong></div>
    <div class="end-rise"><small>MOVIMENTO</small><strong>Entrada e scroll discretos</strong></div>
  </div>
  <p class="end-cta end-rise">Quer um site assim?<br><em>Me chama no Direct.</em></p>
</section>

<script src="/reel/gsap.min.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s) }
  var $$ = function (s) { return [].slice.call(document.querySelectorAll(s)) }
  var CHAPTERS = [['01', 'Início'], ['02', 'Método'], ['03', 'Programa'], ['04', 'Henrique'], ['05', 'Próximo passo']]
  $('#chapters').innerHTML = CHAPTERS.map(function (c) { return '<div class="chapter rise"><i></i><span><b>' + c[0] + '</b>' + c[1] + '</span></div>' }).join('')

  var site = function () { return $('#site').contentWindow }

  // pronto quando a página carregou tudo: GSAP, ScrollTrigger, fontes e fotos.
  // O relógio da página ainda não andou, então o preloader espera no quadro zero.
  window.__stageReady = function () {
    try {
      var w = site(), d = w.document
      var imgs = [].slice.call(d.images).every(function (i) { return i.complete && i.naturalWidth > 0 })
      return !!window.gsap && document.fonts.status === 'loaded' && d.readyState === 'complete' && !!w.gsap && !!w.ScrollTrigger && d.fonts.status === 'loaded' && imgs
    } catch (e) { return false }
  }
  // durante o aquecimento só o palco anda
  window.__warm = function (T) { window.__vt.advance(T) }

  window.__setup = function (BASE) {
    var gsap = window.gsap
    var w = site(), d = w.document
    var VH = w.innerHeight
    var MAX = d.documentElement.scrollHeight - VH
    var S = [].slice.call(d.querySelectorAll('.e-parent')).map(function (el) { return Math.round(el.getBoundingClientRect().top + w.pageYOffset) })
    // limites das partes, em posição de scroll: início, método, programa, Henrique, resto
    // cada parte acende quando a seção já ocupa boa parte da tela
    var lead = function (y) { return Math.max(0, Math.min(MAX, y - VH * .35)) }
    var B = [0, lead(S[2]), lead(S[3]), lead(S[4]), lead(S[5]), MAX]
    var bars = $$('.chapter i'), chips = $$('.chapter')
    var scroll = { y: 0 }
    var tl = gsap.timeline({ paused: true })
    var E = 'power2.out'

    // entrada do palco: sobe 14px e aparece, como no hero do site
    tl.fromTo($$('.rise'), { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: .8, ease: E, stagger: .06 }, 0)

    // o scroll: anda entre as seções e desacelera em cada uma, sem parar de vez
    var t = 4.4, cur = 0
    var move = function (to, hold, drift) {
      to = Math.min(to, MAX)
      var dur = Math.max(1.3, Math.abs(to - cur) / 430)
      tl.to(scroll, { y: to, duration: dur, ease: 'sine.inOut' }, t)
      t += dur; cur = to
      if (hold) {
        var dy = Math.max(0, Math.min(drift === undefined ? 26 : drift, MAX - cur))
        tl.to(scroll, { y: cur + dy, duration: hold, ease: 'none' }, t)
        t += hold; cur += dy
      }
    }
    move(S[1], 1.8)                 // o que muda
    move(S[2], 1.8)                 // método
    move(S[3], 1.9)                 // programa
    move(S[4], 3.0, S[5] - VH - S[4]) // Henrique: atravessa a seção devagar
    move(S[5], 1.7)                 // para quem faz sentido
    move(S[6], 1.5)                 // perguntas
    move(S[7], 1.6)                 // próximo passo
    move(MAX, 1.8, 0)               // rodapé
    var END = t

    // fecho
    tl.to(['#window', '#chapters'], { autoAlpha: 0, duration: .5, ease: 'power1.in' }, END)
    tl.set('#end', { visibility: 'visible' }, END + .45)
    tl.fromTo($$('.end-rise'), { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: .8, ease: E, stagger: .09 }, END + .5)
    tl.fromTo('.end-cta em', { '--u': 0 }, { '--u': 1, duration: .7, ease: 'power2.inOut' }, END + 1.4)
    tl.to({}, { duration: .01 }, END + 4.2)
    window.__duration = END + 4.2

    var chapter = function (y) {
      bars.forEach(function (bar, k) {
        var p = Math.max(0, Math.min(1, (y - B[k]) / (B[k + 1] - B[k])))
        bar.style.transform = 'scaleX(' + p.toFixed(4) + ')'
        chips[k].classList.toggle('on', y >= B[k] - .5 && (k === bars.length - 1 || y < B[k + 1] - .5))
      })
    }

    // a página entra no relógio pouco depois do palco: o preloader começa com a margem já no lugar
    var LAG = .35, siteBase = w.__vt.now()
    window.__frame = function (time) {
      tl.time(time, false)
      window.__vt.advance(BASE + time * 1000)
      var y = Math.round(scroll.y * 2) / 2
      chapter(y)
      if (Math.abs(w.pageYOffset - y) > .25) { w.scrollTo({ top: y, behavior: 'instant' }); w.dispatchEvent(new w.Event('scroll')) }
      w.__vt.advance(siteBase + Math.max(0, time - LAG) * 1000)
    }
    window.__frame(0)
    return { VH: VH, MAX: MAX, S: S, duration: window.__duration }
  }
})()
</script>
</body>
</html>
