<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Cases — peças para Instagram</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira:wght@600;700&display=swap');
@font-face{font-family:Inter;src:url('/menuzito/assets/fonts/inter-latin.woff2') format('woff2');font-weight:100 900}
*{box-sizing:border-box}html,body{margin:0;width:1112px;background:#171A2C}body{padding:16px}body{font-family:Inter,sans-serif;color:white}main{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--bg)}
.junior{--bg:#0B0B0C;--accent:#CF9B3A;--muted:#B8B8BC;font-family:Barlow,Arial,sans-serif}.processbase{--bg:#171A2C;--accent:#FF5900;--muted:#AEBBCD}
.top{position:absolute;left:72px;right:72px;top:68px;display:flex;align-items:center;justify-content:space-between}.logo{width:280px;height:70px;object-fit:contain;object-position:left center}.processbase .logo{width:270px}.tag{font-size:21px;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;text-align:right;color:var(--muted)}
.title{position:absolute;top:204px;left:72px;right:72px;margin:0;font-size:91px;font-weight:400;line-height:1.03;letter-spacing:-.055em}.junior .title{font-family:Saira,Arial,sans-serif;font-weight:700;letter-spacing:-.025em;font-size:94px}.sub{position:absolute;left:76px;top:421px;color:var(--muted);font-size:27px;line-height:1.5;margin:0}
.window{position:absolute;left:72px;top:530px;width:936px;height:570px;overflow:hidden;border:1px solid #ffffff26;border-radius:12px;background:var(--bg)}.bar{height:42px;border-bottom:1px solid #ffffff20;display:flex;gap:8px;align-items:center;padding:0 18px;color:var(--muted);font-size:16px;letter-spacing:.03em}.dot{width:6px;height:6px;border-radius:50%;background:#ffffff50}.bar span{margin-left:14px}.screen{display:block;width:936px;height:526.5px;object-fit:cover;object-position:top}.blank .screen{visibility:hidden}
.footer{position:absolute;left:72px;right:72px;top:1170px;display:flex;justify-content:space-between;align-items:center;gap:20px}.caption{font-size:23px;line-height:1.5;color:var(--muted)}.cta{font-size:26px;font-weight:600;border-bottom:2px solid var(--accent);padding-bottom:10px;white-space:nowrap}.arrow{color:var(--accent);margin-left:12px}.story{height:1920px}.story .top{top:240px}.story .title{top:398px;font-size:100px}.story .sub{top:635px;max-width:870px}.story .window{top:805px}.story .footer{top:1560px;align-items:flex-start;flex-direction:column;gap:30px}.story .caption{font-size:30px;line-height:1.4;max-width:670px}.story .cta{font-size:35px}.story .window{height:570px}
</style></head><body><main id="art"><div class="top"><img class="logo" alt=""><div class="tag">Web design<br>Case selecionado</div></div><h1 class="title"></h1><p class="sub"></p><div class="window"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span></span></div><img class="screen" alt="Captura real do site desenvolvido"></div><div class="footer"><div class="caption"></div><div class="cta">Vamos criar o seu site?<span class="arrow">↗</span></div></div></main>
<script>
const p=new URLSearchParams(location.search),brand=p.get('case')==='junior'?'junior':'processbase',story=p.get('format')==='story';
const data=brand==='junior'?{name:'Júnior Automáticos',logo:'/brands/junior-automaticos/logo/junior-automaticos-logo-horizontal.png',title:'Especialização<br>que se vê.',sub:'Um site com a identidade de quem entende do assunto.',caption:'Marca forte. Serviços claros.<br>Fale comigo no Direct.'}:{name:'ProcessBase',logo:'/brands/processbase/logo/processbase-logo-reverse.svg',title:'Estratégia que<br>ganha forma.',sub:'Identidade, conteúdo e movimento no mesmo projeto.',caption:'Um negócio com personalidade.<br>Um site também. Fale no Direct.'};
document.querySelector('main').className=brand+(story?' story':'')+(p.has('blank')?' blank':'');document.querySelector('.logo').src=data.logo;document.querySelector('.logo').alt=data.name;document.querySelector('.title').innerHTML=data.title;document.querySelector('.sub').textContent=data.sub;document.querySelector('.caption').innerHTML=data.caption;document.querySelector('.bar span').textContent=data.name+' / versão desktop';document.querySelector('.screen').src='/case-social-assets/'+brand+'-hero.png';
</script></body></html>
