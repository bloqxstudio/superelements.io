<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Do anúncio à conversa</title>
  <desc id="desc">Um anúncio se conecta por um caminho pontilhado a uma conversa no celular.</desc>
  <g id="ad-card" transform="translate(0 182)">
    <rect x="1" y="1" width="283" height="128" rx="5" fill="#FAF9F5" stroke="#777777"/>
    <circle cx="18" cy="15" r="4" fill="#AAAAAA"/><circle cx="31" cy="15" r="4" fill="#AAAAAA"/>
    <rect x="25" y="40" width="72" height="72" fill="#2B3CF0"/>
    <rect x="125" y="46" width="105" height="11" fill="#4E4E4E"/><rect x="125" y="76" width="125" height="8" fill="#B8B8B8"/><rect x="125" y="100" width="88" height="8" fill="#B8B8B8"/>
  </g>
  <path id="journey-path" d="M285 247c110 0 60-78 150-78s60 145 155 145 25-35 115-35" fill="none" stroke="#7180FF" stroke-width="3" stroke-dasharray="8 8"/>
  <g id="journey-nodes" fill="#2B3CF0"><rect x="300" y="234" width="24" height="24"/><rect x="420" y="156" width="24" height="24"/><rect x="537" y="301" width="24" height="24"/><rect x="665" y="266" width="24" height="24"/></g>
  <g id="phone" transform="translate(667 16)">
    <rect x="2" y="2" width="248" height="461" rx="36" fill="#F8F7F3" stroke="#111111" stroke-width="4"/>
    <rect x="86" y="18" width="80" height="24" rx="14" fill="#111111"/>
    <g id="phone-status" fill="#111111"><rect x="203" y="26" width="3" height="7"/><rect x="208" y="23" width="3" height="10"/><rect x="213" y="20" width="3" height="13"/><rect x="223" y="23" width="16" height="9" rx="2"/></g>
    <g id="phone-buttons" fill="#111111"><rect x="-3" y="96" width="5" height="34" rx="2"/><rect x="-3" y="144" width="5" height="56" rx="2"/><rect x="250" y="126" width="5" height="70" rx="2"/></g>
    <g id="message-in"><rect x="32" y="108" width="155" height="60" rx="14" fill="#E4E2DE"/><rect x="55" y="128" width="85" height="8" fill="#BDBDBD"/></g>
    <g id="message-out"><rect x="56" y="235" width="168" height="72" rx="16" fill="#2B3CF0"/><rect x="80" y="260" width="106" height="9" fill="#A9B2FF"/></g>
    <g id="message-reply"><path d="M38 355h112v64H38l-13 9 5-24v-35a14 14 0 0 1 14-14z" fill="#E4E2DE"/><circle cx="70" cy="387" r="6" fill="#A8A8A8"/><circle cx="91" cy="387" r="6" fill="#A8A8A8"/><circle cx="112" cy="387" r="6" fill="#A8A8A8"/></g>
  </g>
  <g id="message-burst" fill="none" stroke="#2B3CF0" stroke-width="3"><path d="M884 238l2-22M895 243l11-17M901 254l11-7"/></g>
</svg>
